<script>
/* ===== PARSER (rein, ohne DOM – testbar) ===== */
const Parser = (() => {
  function decode(buf) {
    const utf = new TextDecoder('utf-8').decode(buf);
    if (!utf.includes('�')) return utf.replace(/^﻿/, '');
    return new TextDecoder('windows-1252').decode(buf);
  }
  function splitCsv(text) {
    const first = text.split(/\r?\n/).find(l => l.trim()) || '';
    const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.some(c => c.trim() !== '')) rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur); if (row.some(c => c.trim() !== '')) rows.push(row);
    return rows;
  }
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  const COLS = {
    date: ['buchungstag', 'buchungsdatum', 'datum', 'date', 'bookingdate', 'wertstellung', 'valutadatum', 'valuedate'],
    amount: ['betrag', 'betrageur', 'amount', 'umsatz', 'betraginEUR'.toLowerCase()],
    counterparty: ['beguenstigterzahlungspflichtiger', 'begunstigterzahlungspflichtiger', 'zahlungsempfaengerin', 'zahlungsempfanger', 'empfaenger', 'auftraggeberempfaenger', 'auftraggeberbeguenstigter', 'name', 'counterparty', 'payee', 'beschreibung'],
    purpose: ['verwendungszweck', 'purpose', 'reference', 'buchungstext', 'description', 'vorgang'],
    iban: ['kontonummeriban', 'iban', 'kontonummer'],
    currency: ['waehrung', 'wahrung', 'currency'],
    info: ['info', 'status']
  };
  function findHeader(rows) {
    for (let i = 0; i < Math.min(rows.length, 30); i++) {
      const h = rows[i].map(norm);
      const has = k => COLS[k].some(c => h.includes(c));
      if (has('date') && has('amount')) return i;
    }
    return -1;
  }
  function col(h, key, exclude = []) {
    for (const c of COLS[key]) { const i = h.indexOf(c); if (i >= 0 && !exclude.includes(i)) return i; }
    return -1;
  }
  function parseDate(s) {
    s = (s || '').trim();
    let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})$/);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`; }
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    return null;
  }
  function parseAmount(s) {
    s = (s || '').replace(/\s|€|EUR/gi, '').replace(/^\+/, '');
    if (!s) return null;
    let neg = false;
    if (/^-/.test(s) || /-$/.test(s)) { neg = true; s = s.replace(/-/g, ''); }
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > ld) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
    const v = Math.round(parseFloat(s) * 100);
    if (!isFinite(v)) return null;
    return neg ? -v : v;
  }
  function maskIban(s) {
    s = (s || '').replace(/\s/g, '');
    if (s.length < 8) return s || null;
    return s.slice(0, 4) + ' **** ' + s.slice(-4);
  }
  function parse(text) {
    const rows = splitCsv(text);
    const hi = findHeader(rows);
    if (hi < 0) throw new Error('Keine Spalten für Datum und Betrag gefunden. Ist das ein Umsatz-Export als CSV?');
    const h = rows[hi].map(norm);
    const iDate = col(h, 'date'), iAmt = col(h, 'amount');
    const iCp = col(h, 'counterparty'), iPur = col(h, 'purpose', [iCp]);
    const iIban = h.indexOf('kontonummeriban') >= 0 ? h.indexOf('kontonummeriban') : (h.indexOf('iban') >= 0 && h.indexOf('iban') !== 0 ? h.indexOf('iban') : -1);
    const iCur = col(h, 'currency'), iInfo = col(h, 'info');
    const iText = h.indexOf('buchungstext');
    const out = [], errors = [];
    for (let r = hi + 1; r < rows.length; r++) {
      const x = rows[r];
      const date = parseDate(x[iDate]); const amount = parseAmount(x[iAmt]);
      if (!date || amount === null) { errors.push(r + 1); continue; }
      if (amount === 0) continue;
      const info = iInfo >= 0 ? (x[iInfo] || '').toLowerCase() : '';
      let purpose = iPur >= 0 ? (x[iPur] || '').trim() : '';
      if (iText >= 0 && iText !== iPur && x[iText]) purpose = purpose ? purpose : x[iText].trim();
      out.push({
        booked_on: date,
        amount_cents: amount,
        currency: iCur >= 0 && x[iCur] ? x[iCur].trim().toUpperCase() : 'EUR',
        counterparty: iCp >= 0 ? (x[iCp] || '').trim() || null : null,
        purpose: purpose || null,
        counterparty_iban_masked: iIban >= 0 ? maskIban(x[iIban]) : null,
        status: info.includes('vorgemerkt') || info.includes('pending') ? 'pending' : 'booked'
      });
    }
    return { rows: out, errors, columns: rows[hi] };
  }
  async function sha256(s) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(v => v.toString(16).padStart(2, '0')).join('');
  }
  async function withHashes(accountId, rows) {
    const seen = {};
    for (const t of rows) {
      const base = [accountId, t.booked_on, t.amount_cents, (t.counterparty || '').toLowerCase(), (t.purpose || '').toLowerCase().replace(/\s+/g, ' ')].join('|');
      seen[base] = (seen[base] || 0) + 1;
      t.dedupe_hash = await sha256(base + '|' + seen[base]);
    }
    return rows;
  }
  function categorize(t, rules) {
    const sign = t.amount_cents < 0 ? -1 : 1;
    for (const r of rules) {
      if (r.amount_sign && r.amount_sign !== sign) continue;
      const hay = (r.field === 'purpose' ? t.purpose : r.field === 'iban' ? t.counterparty_iban_masked : t.counterparty) || '';
      if (hay.toLowerCase().includes(r.pattern.toLowerCase())) return r.category_id;
    }
    return null;
  }
  return { decode, splitCsv, parse, parseDate, parseAmount, withHashes, categorize };
})();
/* ===== /PARSER ===== */
</script>

const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (s, n) => { const d = new Date(s + 'T12:00:00'); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return iso(d); };
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 864e5);
const fmtDate = (s, opt = { day: 'numeric', month: 'short' }) => s ? new Date(s + 'T12:00:00').toLocaleDateString('de-DE', opt) : '';
const fmtDay = d => { const t = TODAY(); if (d === t) return 'Heute'; if (d === addDays(t, -1)) return 'Gestern'; return new Date(d + 'T12:00:00').toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'short' }); };
const INTERVAL = { weekly: 'wöchentlich', '4weekly': 'alle 4 Wochen', monthly: 'monatlich', '2monthly': 'alle 2 Monate', quarterly: 'vierteljährlich', halfyearly: 'halbjährlich', yearly: 'jährlich' };
const PER_MONTH = { weekly: 52 / 12, '4weekly': 13 / 12, monthly: 1, '2monthly': 1 / 2, quarterly: 1 / 3, halfyearly: 1 / 6, yearly: 1 / 12 };
function nextDate(s, iv) {
  switch (iv) { case 'weekly': return addDays(s, 7); case '4weekly': return addDays(s, 28); case 'monthly': return addMonths(s, 1); case '2monthly': return addMonths(s, 2);
    case 'quarterly': return addMonths(s, 3); case 'halfyearly': return addMonths(s, 6); default: return addMonths(s, 12); }
}
function occurrences(c, from, to) { const out = []; let d = c.next_due_on; if (!d) return out; let g = 0; while (d < from && g++ < 400) d = nextDate(d, c.interval); while (d <= to && g++ < 800) { out.push(d); d = nextDate(d, c.interval); } return out; }
const isTransfer = t => { const c = S.cats[t.category_id]; return c && c.kind === 'transfer'; };
const leaves = () => S.tx.filter(t => !t.is_split_parent);

  chev: '<path d="M9 6l6 6-6 6"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};

async function load() {
  S.loading = true; render();
  const [a, c, r, t, k, ct, b, ps] = await Promise.all([
    sb.from('fin_accounts').select('*').eq('archived', false).order('created_at'),
    sb.from('fin_categories').select('*').order('name'),
    sb.from('fin_category_rules').select('*').order('priority'),
    sb.from('fin_transactions').select('id,account_id,booked_on,amount_cents,counterparty,purpose,category_id,category_source,contract_id,parent_id,status,is_split_parent,note').order('booked_on', { ascending: false }).order('created_at', { ascending: false }).limit(4000),
    sb.from('fin_bank_connections').select('id,aspsp_name,status,consent_valid_until,last_error,updated_at').in('status', ['active', 'expired', 'error']).order('created_at', { ascending: false }),
    sb.from('fin_contracts').select('*').order('next_due_on'),
    sb.from('fin_budgets').select('*'),
    sb.from('fin_positions').select('*').order('value_cents', { ascending: false })
  ]);
  const e = [a, c, r, t, k, ct, b, ps].map(x => x.error).find(Boolean);
  S.err = e ? e.message : null;
  S.accounts = a.data || []; S.catList = c.data || []; S.rules = r.data || []; S.tx = t.data || [];
  S.conns = k.data || []; S.contracts = ct.data || []; S.budgets = b.data || []; S.positions = ps.data || [];
  S.cats = Object.fromEntries(S.catList.map(x => [x.id, x]));
  S.loading = false; render();
}
async function fn(body) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(SB_URL + '/functions/v1/fin-bank', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + (session ? session.access_token : '') }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('Fehler ' + r.status));
  return d;
}
async function syncNow(silent = false) {
  if (S.syncing) return;
  S.syncing = true; S.lastAuto = Date.now(); render();
  try {
    const d = await fn({ action: 'sync' });
    const n = (d.synced || []).reduce((s, x) => s + x.inserted, 0);
    const errs = (d.synced || []).flatMap(x => x.errors || []);
    if (errs.length) toast('Teilweise aktualisiert: ' + errs[0]);
    else if (!silent || n) toast(n ? `${n} neue Buchung${n === 1 ? '' : 'en'}` : 'Alles aktuell');
  } catch (e) { if (!silent) toast('Abruf fehlgeschlagen: ' + e.message); }
  S.syncing = false; await load();
}
function maybeAutoSync() {
  if (!S.user || !S.conns.some(c => c.status === 'active')) return;
  const last = Math.max(0, ...S.accounts.filter(a => a.source === 'psd2' && a.last_sync_at).map(a => Date.parse(a.last_sync_at)));
  if (Date.now() - last > 5 * 60e3 && Date.now() - S.lastAuto > 60e3) syncNow(true);
}
async function openBank() {
  S.sheet = { kind: 'bank', step: 'loading' }; render();

/* ===== Berechnungen ===== */
function giroBalance() { return S.accounts.filter(a => a.type === 'giro' && a.include_in_total).reduce((s, a) => s + Number(a.balance_cents), 0); }
function total() { return S.accounts.filter(a => a.include_in_total).reduce((s, a) => s + Number(a.balance_cents), 0); }
function payPeriod() {
  const t = TODAY();
  const inc = S.contracts.filter(c => c.status === 'active' && c.is_income && c.next_due_on).sort((a, b) => a.next_due_on < b.next_due_on ? -1 : 1)[0];
  if (inc) return { end: addDays(inc.next_due_on, -1), label: `bis ${esc(inc.provider)} am ${fmtDate(inc.next_due_on)}`, income: inc };
  const d = new Date(); const end = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  return { end, label: `bis Monatsende (${fmtDate(end)})`, income: null };
}
function freeToSpend() {
  const t = TODAY(), p = payPeriod();
  const upcoming = [];
  for (const c of S.contracts.filter(c => c.status === 'active' && !c.is_income)) for (const d of occurrences(c, addDays(t, 1), p.end)) upcoming.push({ c, d });
  const sumUp = upcoming.reduce((s, x) => s + Number(x.c.amount_cents), 0);
  const free = giroBalance() + sumUp;
  const days = Math.max(1, daysBetween(t, p.end) + 1);
  return { ...p, free, perDay: Math.floor(free / days), days, upcoming: upcoming.sort((a, b) => a.d < b.d ? -1 : 1), sumUp };
}
function forecast(days = 30) {
  const t = TODAY(), end = addDays(t, days); let bal = giroBalance();
  const ev = [];
  for (const c of S.contracts.filter(c => c.status === 'active')) for (const d of occurrences(c, addDays(t, 1), end)) ev.push({ d, v: Number(c.amount_cents), name: c.provider });
  ev.sort((a, b) => a.d < b.d ? -1 : 1);
  const pts = [{ d: t, v: bal }];
  for (let i = 1; i <= days; i++) { const d = addDays(t, i); for (const e of ev.filter(e => e.d === d)) bal += e.v; pts.push({ d, v: bal }); }
  return { pts, ev, end, min: Math.min(...pts.map(p => p.v)) };
}
function monthRange(offset = 0) { const d = new Date(); const s = new Date(d.getFullYear(), d.getMonth() + offset, 1); const e = new Date(d.getFullYear(), d.getMonth() + offset + 1, 0); return [iso(s), iso(e)]; }
function spentIn(catId, from, to) { return leaves().filter(t => t.category_id === catId && t.amount_cents < 0 && t.booked_on >= from && t.booked_on <= to).reduce((s, t) => s - Number(t.amount_cents), 0); }
function monthStats(n = 6) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const [f, e] = monthRange(-i);
    const xs = leaves().filter(t => t.booked_on >= f && t.booked_on <= e && !isTransfer(t) && t.status === 'booked');
    out.push({ label: new Date(f + 'T12:00:00').toLocaleDateString('de-DE', { month: 'short' }), inc: xs.filter(t => t.amount_cents > 0).reduce((s, t) => s + Number(t.amount_cents), 0), out: -xs.filter(t => t.amount_cents < 0).reduce((s, t) => s + Number(t.amount_cents), 0) });
  }
  return out;
}

function contractStatus(c) {
  const [mf, me] = monthRange(0), t = TODAY();
  const paid = S.tx.filter(x => x.contract_id === c.id && x.booked_on >= mf && x.booked_on <= me && !x.is_split_parent).sort((a, b) => a.booked_on < b.booked_on ? 1 : -1);
  const due = occurrences(c, t, me).filter(d => !paid.some(p => Math.abs(daysBetween(p.booked_on, d)) <= 3));
  return { paid, dueThisMonth: due, paidSum: paid.reduce((s, x) => s + Number(x.amount_cents), 0), openSum: due.length * Number(c.amount_cents) };
}
function cashAccounts() { return S.accounts.filter(a => ['giro', 'tagesgeld', 'bargeld', 'virtual'].includes(a.type)); }
function wealth() {
  const cash = cashAccounts().reduce((s, a) => s + Number(a.balance_cents), 0);
  const inv = S.positions.reduce((s, p) => s + Number(p.invested_cents), 0);
  const val = S.positions.reduce((s, p) => s + Number(p.value_cents), 0);
  return { cash, inv, val, total: cash + val };
}
function outlook() {
  const ms = []; for (let i = 3; i >= 1; i--) { const [f, e] = monthRange(-i); const xs = leaves().filter(t => t.booked_on >= f && t.booked_on <= e && !isTransfer(t) && t.status === 'booked'); ms.push({ label: new Date(f + 'T12:00:00').toLocaleDateString('de-DE', { month: 'short' }), net: xs.reduce((s, t) => s + Number(t.amount_cents), 0) }); }
  const avg = Math.round(ms.reduce((s, m) => s + m.net, 0) / ms.length);
  const cash = wealth().cash;
  const at = n => cash + avg * n;
  const months = avg < 0 ? Math.floor(cash / -avg * 10) / 10 : null;
  return { ms, avg, cash, at, months };
}

function filteredTx() {

  return leaves().filter(x => {
    if (S.filter === 'out' && x.amount_cents > 0) return false;

    if (S.filter === 'open' && x.category_id) return false;
    if (S.catFilter && x.category_id !== S.catFilter) return false;
    if (!q) return true;
    const amt = (Math.abs(x.amount_cents) / 100).toFixed(2).replace('.', ',');
    const cat = (S.cats[x.category_id] || {}).name || '';

    <div class="chips" role="group" aria-label="Filter">${chip('all', 'Alle')}${chip('out', 'Ausgaben')}${chip('in', 'Eingänge')}${chip('open', 'Offen ' + open)}</div>

}

function vContracts() {
  const act = S.contracts.filter(c => c.status === 'active' && !c.is_income);
  const inc = S.contracts.filter(c => c.status === 'active' && c.is_income);
  const sug = S.contracts.filter(c => c.status === 'suggested');
  const gone = S.contracts.filter(c => c.status === 'cancel_sent' || c.status === 'cancelled');
  const perMonth = act.reduce((s, c) => s + Number(c.amount_cents) * PER_MONTH[c.interval], 0);
  const st = Object.fromEntries(act.map(c => [c.id, contractStatus(c)]));
  const paidSum = act.reduce((s, c) => s + st[c.id].paidSum, 0), openSum = act.reduce((s, c) => s + st[c.id].openSum, 0);
  const paidPct = paidSum + openSum ? Math.round(paidSum / (paidSum + openSum) * 100) : 0;
  const item = c => {
    const cb = cancelBy(c);
    const cs = st[c.id];
    const stat = !cs ? '' : cs.paid.length ? `<span class="pill ok" style="margin-top:4px">✓ abgebucht ${fmtDate(cs.paid[0].booked_on)}${cs.dueThisMonth.length ? ' · noch ' + cs.dueThisMonth.length + '×' : ''}</span>`
      : cs.dueThisMonth.length ? `<span class="pill" style="margin-top:4px;border-color:rgba(200,176,122,.45);color:var(--accent)">kommt am ${fmtDate(cs.dueThisMonth[0])}</span>` : `<span class="pill" style="margin-top:4px">diesen Monat nicht fällig</span>`;
    const warn = cb && daysBetween(TODAY(), cb) <= 30 && daysBetween(TODAY(), cb) >= 0;
    return rowBtn('contract', `data-id="${c.id}"`, `<span class="stack" style="gap:2px"><span style="font-size:15px;font-weight:500">${esc(c.provider)}</span><span style="font-size:12px;color:${warn ? 'var(--danger)' : 'var(--muted)'}">${warn ? `Kündigen bis ${fmtDate(cb)} · noch ${daysBetween(TODAY(), cb)} Tage` : (c.status === 'cancel_sent' ? 'Kündigung verschickt' : c.status === 'cancelled' ? 'gekündigt' : `${INTERVAL[c.interval]} · nächste ${fmtDate(c.next_due_on)}`)}</span>${stat}</span>`,
      `<span style="text-align:right">${eur(Number(c.amount_cents))}<span class="muted" style="display:block;font-size:12px">${INTERVAL[c.interval]}</span></span>`);
  };
  const byIv = {};
  for (const c of act) (byIv[c.interval] = byIv[c.interval] || []).push(c);
  return `<div class="scroll stack" style="gap:18px">
    <header style="display:flex;justify-content:space-between;align-items:flex-end">
      <div class="stack" style="gap:4px"><h1>Verträge</h1><span class="muted" style="font-size:13px">${act.length} aktiv · ≈ ${eurPlain(-perMonth)} pro Monat</span></div>
      <button class="icon-btn gold" data-act="new-contract" aria-label="Vertrag hinzufügen">${svg('plus', 18, 2)}</button>
    </header>
    ${act.length ? `<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="muted" style="font-size:14px">Fixkosten pro Monat</span><span class="muted" style="font-size:12px">${eurPlain(-perMonth * 12)} im Jahr</span></div>
      <span style="font-size:34px">${eur(-perMonth)}</span>
      <div class="bar"><i style="width:${paidPct}%"></i></div>
      <div style="display:flex;justify-content:space-between;font-size:13px"><span><span class="pos">✓</span> ${new Date().toLocaleDateString('de-DE', { month: 'long' })} abgebucht: ${eurPlain(-paidSum)}</span><span style="color:var(--accent)">kommt noch: ${eurPlain(-openSum)}</span></div>
      <span class="muted" style="font-size:12px">${act.length} Verträge · Durchschnittswerte, Turnus auf Monat umgerechnet</span>
    </section>` : ''}
    ${sug.map(c => `<section class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px;border-color:rgba(200,176,122,.45)">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="over" style="color:var(--accent)">Neu erkannt</span><span class="muted" style="font-size:12px">${INTERVAL[c.interval]}</span></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span style="font-size:16px;font-weight:500">${esc(c.provider)}</span>${eur(Number(c.amount_cents))}</div>
      <div style="display:flex;gap:8px">
        <button class="btn primary" style="flex:1" data-act="c-accept" data-id="${c.id}">${c.is_income ? 'Ist eine Einnahme' : 'Ist ein Vertrag'}</button>
        <button class="btn" style="flex:1" data-act="c-dismiss" data-id="${c.id}">${c.is_income ? 'Nein' : 'Kein Vertrag'}</button>
      </div></section>`).join('')}
    ${Object.keys(INTERVAL).filter(k => byIv[k]).map(k => `<section class="card" style="padding:4px 16px"><span style="display:block;padding-top:12px" class="over">${INTERVAL[k]}</span>${byIv[k].map(item).join('')}</section>`).join('')}
    ${inc.length ? `<section class="card" style="padding:4px 16px"><span style="display:block;padding-top:12px" class="over">Regelmäßige Einnahmen</span>${inc.map(item).join('')}</section>` : ''}
    ${!act.length && !sug.length ? '<div class="empty">Noch keine Verträge. Sie werden aus deinen Umsätzen erkannt, sobald eine Zahlung mindestens dreimal regelmäßig kam.</div>' : ''}
    ${gone.length ? `<section class="card" style="padding:4px 16px"><span style="display:block;padding-top:12px" class="over">Gekündigt</span>${gone.map(item).join('')}</section>` : ''}
    <button class="btn block" data-act="detect" style="background:transparent;color:var(--muted);font-weight:400">Verträge neu erkennen</button>
    <span class="muted" style="font-size:12px">Kündigungsfristen kannst du mit einem Tipp ins Jarvis-Cockpit legen.</span>
  </div>`;
}
function cancelBy(c) {
  if (!c.notice_period_days) return null;
  const end = c.min_term_end_on || (c.status === 'active' ? c.next_due_on : null);
  return end ? addDays(end, -Number(c.notice_period_days)) : null;
}

function vBudget() {
  const f = freeToSpend(), fc = forecast(30);
  const W = 326, H = 96, pad = 6;
  const vals = fc.pts.map(p => p.v); let mx = Math.max(...vals), mn = Math.min(...vals); const padv = Math.max(2000, (mx - mn) * 0.15); mx += padv; mn -= padv;
  const y = v => pad + (H - 2 * pad) * (1 - (v - mn) / ((mx - mn) || 1));
  const pts = fc.pts.map((p, i) => `${Math.round(i / (fc.pts.length - 1) * W)},${Math.round(y(p.v))}`).join(' ');
  const zero = mn < 0 ? `<line x1="0" y1="${y(0)}" x2="${W}" y2="${y(0)}" stroke="var(--danger)" stroke-dasharray="3 4" stroke-width="1"/>` : '';
  const [mf, me] = monthRange(0);
  const budgets = S.budgets.map(b => { const c = S.cats[b.category_id] || { name: '?' }; const sp = spentIn(b.category_id, mf, me); const pct = Math.round(sp / b.amount_cents * 100); return { b, c, sp, pct }; }).sort((a, b) => b.pct - a.pct);
  const ms = monthStats(6); const mmax = Math.max(1, ...ms.map(m => Math.max(m.inc, m.out)));
  const catTot = {};
  for (const t of leaves().filter(t => t.booked_on >= mf && t.amount_cents < 0 && !isTransfer(t))) catTot[t.category_id || ''] = (catTot[t.category_id || ''] || 0) - Number(t.amount_cents);
  const tops = Object.entries(catTot).sort((a, b) => b[1] - a[1]).slice(0, 7); const tmax = Math.max(1, ...tops.map(x => x[1]));
  return `<div class="scroll stack" style="gap:20px">
    <header class="stack" style="gap:4px"><h1>Geld & Budget</h1><span class="muted" style="font-size:13px">Frei verfügbar ${f.label}</span></header>
    <section class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="muted" style="font-size:14px">Frei verfügbar</span><span class="muted" style="font-size:12px">≈ ${eurPlain(f.perDay)} / Tag · ${f.days} Tage</span></div>
      <span style="font-size:36px;color:${f.free < 0 ? 'var(--danger)' : 'var(--accent)'}">${eur(f.free)}</span>
      ${!f.income ? `<span class="muted" style="font-size:12px;line-height:17px">Kein regelmäßiges Einkommen bestätigt – Zeitraum bis Monatsende. Bestätige BAföG/Gehalt unter Verträge, dann rechnet die App von Zahltag zu Zahltag.</span>` : ''}
      <div class="stack">${f.upcoming.slice(0, 5).map(x => `<div class="kv"><span>${fmtDate(x.d)} · ${esc(x.c.provider)}</span>${eur(Number(x.c.amount_cents))}</div>`).join('') || '<span class="muted" style="font-size:13px">Keine Vertragsabbuchungen mehr im Zeitraum.</span>'}</div>
    </section>
    <section class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:14px;font-weight:500">Prognose Girokonto</span><span class="muted" style="font-size:12px">in 30 Tagen: ${eurPlain(fc.pts[fc.pts.length - 1].v)}</span></div>
      <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Kontostand von ${eurPlain(fc.pts[0].v)} heute auf ${eurPlain(fc.pts[fc.pts.length - 1].v)} in 30 Tagen, tiefster Stand ${eurPlain(fc.min)}">
        ${zero}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
      <div style="display:flex;justify-content:space-between;font-size:12px" class="muted"><span>heute</span><span>tiefster Stand ${eurPlain(fc.min)}</span><span>${fmtDate(fc.end)}</span></div>
      <span class="muted" style="font-size:12px">Nur bekannte Verträge und Einnahmen – spontane Ausgaben sind nicht eingerechnet.</span>
    </section>
    ${vWealth()}
    <section class="stack" style="gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="over">Budgets · ${new Date().toLocaleDateString('de-DE', { month: 'long' })}</span><button class="btn" data-act="new-budget" style="height:36px">+ Budget</button></div>
      ${budgets.map(({ b, c, sp, pct }) => `<button class="card tap" data-act="budget" data-id="${b.id}" style="padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--text)">
        <div style="display:flex;justify-content:space-between;align-items:baseline;width:100%"><span style="font-size:15px;font-weight:500">${esc(c.name)}</span><span style="font-size:15px;color:${pct > 100 ? 'var(--danger)' : 'var(--text)'}">${eurPlain(sp)}<span class="muted" style="font-size:12px"> / ${eurPlain(b.amount_cents)}</span></span></div>
        <div class="bar" style="width:100%"><i style="width:${Math.min(100, pct)}%;background:${pct > 100 ? 'var(--danger)' : pct > 85 ? '#D9A55B' : 'var(--accent)'}"></i></div>
        <span style="font-size:12px;color:${pct > 100 ? 'var(--danger)' : 'var(--muted)'}">${pct > 100 ? eurPlain(sp - b.amount_cents) + ' über dem Budget' : 'noch ' + eurPlain(b.amount_cents - sp)}</span></button>`).join('') || '<div class="empty">Noch keine Budgets. Lege z. B. eins für Lebensmittel oder Ausgehen an.</div>'}
    </section>
    <section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px">
      <span style="font-size:14px;font-weight:500">Einnahmen und Ausgaben</span>
      <div style="display:grid;grid-template-columns:repeat(${ms.length},minmax(0,1fr));gap:8px;align-items:end;height:110px" role="img" aria-label="Letzte ${ms.length} Monate: ${ms.map(m => `${m.label} Einnahmen ${eurPlain(m.inc)}, Ausgaben ${eurPlain(m.out)}`).join('; ')}">
        ${ms.map(m => `<div style="display:flex;gap:3px;align-items:end;justify-content:center;height:100%"><i style="display:block;width:9px;border-radius:3px 3px 0 0;background:var(--income);height:${Math.max(2, m.inc / mmax * 100)}%"></i><i style="display:block;width:9px;border-radius:3px 3px 0 0;background:var(--muted);height:${Math.max(2, m.out / mmax * 100)}%"></i></div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(${ms.length},minmax(0,1fr));gap:8px;font-size:12px;text-align:center" class="muted">${ms.map(m => `<span>${m.label}</span>`).join('')}</div>
      <div style="display:flex;gap:16px;font-size:12px" class="muted"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--income)"></i> Einnahmen</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--muted)"></i> Ausgaben</span><span>ohne Umbuchungen</span></div>
    </section>
    <section class="card" style="padding:4px 16px 8px">
      <span class="over" style="display:block;padding:12px 0 4px">Ausgaben ${new Date().toLocaleDateString('de-DE', { month: 'long' })}</span>
      ${tops.map(([id, v]) => rowBtn('cat-tx', `data-id="${id}"`, `<span class="stack" style="gap:6px;flex:1;margin-right:12px"><span style="font-size:14px">${esc((S.cats[id] || {}).name || 'Ohne Kategorie')}</span><span class="bar" style="height:6px"><i style="width:${v / tmax * 100}%;height:2px;background:var(--accent)"></i></span></span>`, `<span style="font-size:14px">${eurPlain(v)}</span>`)).join('') || '<p class="muted" style="font-size:13px">Noch keine Ausgaben diesen Monat.</p>'}
    </section>
  </div>`;
}

function vWealth() {
  const w = wealth(), o = outlook();
  const gain = w.val - w.inv, gainPct = w.inv ? Math.round(gain / w.inv * 1000) / 10 : 0;
  const pos = S.positions.map(p => { const g = Number(p.value_cents) - Number(p.invested_cents); return rowBtn('position', `data-id="${p.id}"`,
    `<span class="stack" style="gap:2px"><span style="font-size:15px">${esc(p.name)}</span><span class="muted" style="font-size:12px">investiert ${eurPlain(p.invested_cents)} · Stand ${fmtDate(p.value_updated_at)}</span></span>`,
    `<span style="text-align:right">${eur(Number(p.value_cents))}<span style="display:block;font-size:12px" class="${g > 0 ? 'pos' : g < 0 ? 'neg' : 'muted'}">${g ? (g > 0 ? '+ ' : '−') + eurPlain(Math.abs(g)) : '±0'}</span></span>`); }).join('');
  const W = 326, H = 80; const pts = [0, 1, 2, 3, 4, 5, 6].map(n => o.at(n)); const mx = Math.max(...pts, 0), mn = Math.min(...pts, 0);
  const y = v => 6 + (H - 12) * (1 - (v - mn) / ((mx - mn) || 1));
  const line = pts.map((v, i) => `${Math.round(i / 6 * W)},${Math.round(y(v))}`).join(' ');
  return `<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px">
      <span class="muted" style="font-size:14px">Gesamtvermögen</span>
      <span style="font-size:36px">${eur(w.total)}</span>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <div class="card" style="padding:12px;background:var(--bg)"><span class="muted" style="font-size:12px">Cash</span><div style="font-size:20px">${eur(w.cash)}</div></div>
        <div class="card" style="padding:12px;background:var(--bg)"><span class="muted" style="font-size:12px">Depot & Krypto</span><div style="font-size:20px">${eur(w.val)}</div></div>
      </div>
      <div class="stack">${cashAccounts().map(a => `<div class="kv"><span>${esc(a.name)}${a.bank_name ? ' · ' + esc(a.bank_name) : ''}</span>${eur(Number(a.balance_cents))}</div>`).join('')}</div>
    </section>
    <section class="card" style="padding:4px 16px 12px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px"><span class="over">Depot</span><button class="btn" data-act="new-position" style="height:36px">+ Position</button></div>
      <div class="kv"><span>Investiert</span><span>${eurPlain(w.inv)}</span></div>
      <div class="kv"><span>Aktueller Wert</span><span>${eurPlain(w.val)}</span></div>
      <div class="kv"><span>Gewinn / Verlust</span><span class="${gain > 0 ? 'pos' : gain < 0 ? 'neg' : ''}">${gain >= 0 ? '+ ' : '−'}${eurPlain(Math.abs(gain))} (${gainPct >= 0 ? '+' : ''}${String(gainPct).replace('.', ',')} %)</span></div>
      <span class="over" style="display:block;padding:14px 0 2px;font-size:11px">Positionen</span>
      ${pos || '<p class="muted" style="font-size:13px">Noch keine Positionen.</p>'}
      <p class="muted" style="font-size:12px;line-height:17px;margin:10px 0 0">Depotwerte trägst du von Hand ein – die Bankschnittstelle (PSD2) liefert keine Wertpapiere. Antippen zum Aktualisieren.</p>
    </section>
    <section class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px">
      <span style="font-size:14px;font-weight:500">Wenn du so weitermachst</span>
      <span class="muted" style="font-size:13px;line-height:18px">Ø ${o.avg >= 0 ? '+' : '−'} ${eurPlain(Math.abs(o.avg))} pro Monat (Einnahmen minus Ausgaben, ${o.ms.map(m => m.label).join(', ')}, ohne Umbuchungen)</span>
      <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Cash heute ${eurPlain(o.cash)}, in 6 Monaten ${eurPlain(o.at(6))}">
        ${mn < 0 ? `<line x1="0" y1="${y(0)}" x2="${W}" y2="${y(0)}" stroke="var(--danger)" stroke-dasharray="3 4" stroke-width="1"/>` : ''}
        <polyline points="${line}" fill="none" stroke="${o.avg < 0 ? 'var(--danger)' : 'var(--income)'}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>
      <div class="kv"><span>Cash heute</span>${eur(o.cash)}</div>
      <div class="kv"><span>in 1 Monat</span>${eur(o.at(1))}</div>
      <div class="kv"><span>in 3 Monaten</span>${eur(o.at(3))}</div>
      <div class="kv"><span>in 6 Monaten</span><b style="font-weight:500" class="${o.at(6) < 0 ? 'neg' : ''}">${eur(o.at(6))}</b></div>
      ${o.months !== null ? `<span style="font-size:13px;color:${o.months < 6 ? 'var(--danger)' : 'var(--muted)'}">Bei diesem Tempo reicht dein Cash noch etwa ${String(o.months).replace('.', ',')} Monate.</span>` : '<span class="pos" style="font-size:13px">Du gibst im Schnitt weniger aus, als reinkommt.</span>'}
      <span class="muted" style="font-size:12px;line-height:17px">Einfache Hochrechnung. Einmalige Eingänge (z. B. Stipendium) und Käufe über Trade Republic (die Bank liefert keine Details) verzerren den Schnitt.</span>
    </section>`;
}

/* ===== Sheets ===== */

    vSheet() + (S.toast ? `<div class="toast${render.toastEnter ? ' enter' : ''}" role="status">${esc(S.toast)}</div>` : '') +
    `<div class="topbar" aria-hidden="true">${{ home: 'Übersicht', tx: 'Umsätze', contracts: 'Verträge', budget: 'Geld & Budget' }[S.tab]}</div><div class="ptr" aria-hidden="true"><span>${svg('repeat', 16)}</span></div>`;
  const nsc = el.querySelector('.scroll'); if (nsc && !render.resetScroll) nsc.scrollTop = top; render.resetScroll = false;
  const nss = el.querySelector('.sheet'); if (nss && !render.resetSheet) nss.scrollTop = stop; render.resetSheet = false;

const openSheet = s => { const was = !!S.sheet; S.sheet = s; render.resetSheet = true; render.sheetEnter = !was; render(); };
function closeSheet(after) {
  const bg = $('.sheet-bg');
  if (!bg || window.matchMedia('(prefers-reduced-motion: reduce)').matches && false) { S.sheet = null; render(); after && after(); return; }
  bg.classList.add('leave');
  setTimeout(() => { S.sheet = null; render(); after && after(); }, 210);
}
function afterRender() {
  // Einblenden: Startzustand -> nächster Frame -> Endzustand (CSS-Transition, unterbrechbar)
  if (render.sheetEnter) { render.sheetEnter = false; const bg = $('.sheet-bg'); if (bg) requestAnimationFrame(() => requestAnimationFrame(() => bg.classList.remove('enter'))); }
  if (render.toastEnter) { render.toastEnter = false; const t = $('.toast'); if (t) requestAnimationFrame(() => requestAnimationFrame(() => t.classList.remove('enter'))); }
  const sc = $('.scroll'), tb = $('.topbar');
  if (sc && tb) { const upd = () => tb.classList.toggle('show', sc.scrollTop > 44); upd(); sc.onscroll = upd; }
  setupSheetDrag(); setupPullToRefresh();
}
function setupSheetDrag() {
  const sheet = $('.sheet'); if (!sheet || sheet.dataset.drag) return; sheet.dataset.drag = '1';
  let y0 = null, dy = 0, t0 = 0, hist = [];
  sheet.addEventListener('touchstart', e => { if (sheet.scrollTop > 0 || e.touches.length > 1 || e.target.closest('input,textarea,select')) { y0 = null; return; } y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; hist = [[y0, t0]]; }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (y0 === null) return; const y = e.touches[0].clientY; dy = y - y0;
    if (dy < 0) dy = -(Math.abs(dy) * 40) / (40 + Math.abs(dy)); // Gummiband nach oben
    if (Math.abs(dy) > 6) { sheet.classList.add('dragging'); sheet.style.transform = `translateY(${dy}px)`; }
    hist.push([y, Date.now()]); if (hist.length > 5) hist.shift();
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (y0 === null) return; sheet.classList.remove('dragging');
    const [a, b] = [hist[0], hist[hist.length - 1]]; const v = (b[0] - a[0]) / Math.max(1, b[1] - a[1]); // px/ms
    if (dy > 120 || (dy > 20 && v > 0.5)) { sheet.style.transform = ''; closeSheet(); } else sheet.style.transform = '';
    y0 = null;
  });
}
function setupPullToRefresh() {
  const sc = $('.scroll'), ptr = $('.ptr'); if (!sc || sc.dataset.ptr || !S.user) return; sc.dataset.ptr = '1';
  let y0 = null, dy = 0;
  sc.addEventListener('touchstart', e => { y0 = sc.scrollTop <= 0 && !S.sheet ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  sc.addEventListener('touchmove', e => {
    if (y0 === null) return; const raw = e.touches[0].clientY - y0; if (raw <= 0) { dy = 0; return; }
    dy = (raw * 300 * 0.55) / (300 + 0.55 * raw); // Gummiband
    sc.classList.add('pulling'); sc.style.transform = `translateY(${dy}px)`; ptr.style.opacity = Math.min(1, dy / 70); ptr.firstChild.style.transform = `rotate(${dy * 4}deg)`;
  }, { passive: true });
  sc.addEventListener('touchend', () => {
    if (y0 === null) return; y0 = null; sc.classList.remove('pulling'); sc.classList.add('release'); sc.style.transform = ''; ptr.style.opacity = 0;
    setTimeout(() => sc.classList.remove('release'), 380);
    if (dy > 70) { S.conns.some(c => c.status === 'active') ? syncNow() : load(); }
  });
}

  try {
    switch (act) {
      case 'tab': S.tab = b.dataset.tab; S.sheet = null; render.resetScroll = true; render(); break;
      case 'discreet': S.discreet = !S.discreet; try { localStorage.setItem('fin_discreet', S.discreet ? '1' : '0'); } catch (x) {} render(); break;
      case 'filter': S.filter = b.dataset.f; render(); break;
      case 'clear-cat': S.catFilter = null; render(); break;
      case 'open-uncat': S.tab = 'tx'; S.filter = 'open'; S.catFilter = null; render.resetScroll = true; render(); break;
      case 'cat-tx': S.tab = 'tx'; S.filter = 'out'; S.catFilter = id || null; if (!id) S.filter = 'open'; render.resetScroll = true; render(); break;
      case 'add': openSheet({ kind: 'add' }); break;
      case 'new-account': openSheet({ kind: 'account' }); break;
      case 'bank': openBank(); break;
      case 'pick-bank': startBank(b.dataset.name, Number(b.dataset.max) || undefined); break;
      case 'sync': syncNow(); break;
      case 'import': case 'open-account': openSheet({ kind: 'import', acc: id || (S.accounts.find(a => a.source !== 'psd2') || S.accounts[0] || {}).id }); break;
      case 'logout': await sb.auth.signOut(); Object.assign(S, { accounts: [], tx: [], conns: [], contracts: [], budgets: [], sheet: null }); render(); break;
      case 'close': case 'close-bg': { const reload = S.sheet && S.sheet.result; closeSheet(reload ? load : null); break; }
      case 'tx': openSheet({ kind: 'tx', id }); break;
      case 'set-cat': {
        const t = S.tx.find(x => x.id === S.sheet.id); const cat = b.dataset.cat;
        const remember = document.getElementById('remember') ? document.getElementById('remember').checked : false;
        t.category_id = cat; t.category_source = 'manual'; render();
        const n = await rpc('fin_learn_rule', { p_tx: t.id, p_category: cat, p_all: remember });
        if (remember && n > 1) { for (const x of S.tx) if (x.id !== t.id && (x.counterparty || '').trim().toLowerCase() === (t.counterparty || '').trim().toLowerCase() && Math.sign(x.amount_cents) === Math.sign(t.amount_cents) && x.category_source !== 'manual') { x.category_id = cat; x.category_source = 'learned'; } toast(`Gemerkt – ${n} Buchungen sortiert`); }
        else toast('Kategorie gespeichert');
        S.sheet = null; render(); break;
      }
      case 'save-note': { const v = document.getElementById('note').value.trim() || null; const { error } = await sb.from('fin_transactions').update({ note: v }).eq('id', id); if (error) throw error; S.tx.find(x => x.id === id).note = v; toast('Notiz gespeichert'); S.sheet = null; render(); break; }
      case 'split': openSheet({ kind: 'tx', id, split: true, c1: null, c2: S.tx.find(x => x.id === id).category_id }); break;
      case 'split-c1': S.sheet.part = document.querySelector('input[name=part]').value; S.sheet.c1 = b.dataset.cat; render(); break;
      case 'split-c2': S.sheet.part = document.querySelector('input[name=part]').value; S.sheet.c2 = b.dataset.cat; render(); break;
      case 'unsplit': await rpc('fin_unsplit', { p_tx: id }); toast('Aufteilung aufgehoben'); S.sheet = null; await load(); break;
      case 'del-tx': if (confirmDel()) { const { error } = await sb.from('fin_transactions').delete().eq('id', id); if (error) throw error; toast('Gelöscht'); S.sheet = null; await load(); } break;
      case 'new-tx': openSheet({ kind: 'new-tx', dir: 'out' }); break;
      case 'dir': keepForm('#nt-form', ['amt', 'cp', 'day']); S.sheet.dir = b.dataset.d; render(); break;
      case 'nt-cat': keepForm('#nt-form', ['amt', 'cp', 'day']); S.sheet.cat = b.dataset.cat; render(); break;
      case 'contract': openSheet({ kind: 'contract', id }); break;
      case 'new-contract': openSheet({ kind: 'new-contract' }); break;
      case 'c-accept': { const { error } = await sb.from('fin_contracts').update({ status: 'active' }).eq('id', id); if (error) throw error; S.contracts.find(c => c.id === id).status = 'active'; toast('Übernommen'); render(); break; }
      case 'c-dismiss': { const { error } = await sb.from('fin_contracts').update({ status: 'dismissed' }).eq('id', id); if (error) throw error; await sb.from('fin_transactions').update({ contract_id: null }).eq('contract_id', id); S.contracts.find(c => c.id === id).status = 'dismissed'; S.sheet = null; toast('Entfernt – wird nicht mehr vorgeschlagen'); render(); break; }
      case 'c-jarvis': {
        const c = S.contracts.find(x => x.id === id); const cb = cancelBy(c); if (!cb) { toast('Erst Kündigungsfrist eintragen'); break; }
        if (c.jarvis_task_id) { toast('Steht schon im Cockpit'); break; }
        const { data, error } = await sb.from('jarvis_tasks').insert({ title: `Kündigen oder behalten: ${c.provider} (${eurPlain(Math.abs(c.amount_cents))} ${INTERVAL[c.interval]})`, due_date: cb, source: 'jarvis' }).select('id').single();
        if (error) throw error;
        await sb.from('fin_contracts').update({ jarvis_task_id: data.id }).eq('id', id); c.jarvis_task_id = data.id; toast('Frist steht im Jarvis-Cockpit'); render(); break;
      }
      case 'c-cancel': { const c = S.contracts.find(x => x.id === id); openSheet({ kind: 'cancel', id, letter: letterFor(c) }); break; }
      case 'c-sent': {
        const c = S.contracts.find(x => x.id === id); const letter = document.getElementById('letter').value;
        await sb.from('fin_cancellations').insert({ contract_id: id, letter_text: letter, channel: 'email', sent_at: new Date().toISOString(), status: 'sent' });
        await sb.from('fin_contracts').update({ status: 'cancel_sent' }).eq('id', id); c.status = 'cancel_sent';
        setTimeout(() => { S.sheet = null; toast('Als verschickt markiert – bestätige, sobald die Antwort da ist'); }, 400); break;
      }
      case 'c-done': await sb.from('fin_contracts').update({ status: 'cancelled' }).eq('id', id); S.contracts.find(c => c.id === id).status = 'cancelled'; S.sheet = null; toast('Gekündigt'); render(); break;
      case 'copy-letter': try { await navigator.clipboard.writeText(document.getElementById('letter').value); toast('Kopiert'); } catch (x) { toast('Kopieren nicht möglich – Text markieren und kopieren'); } break;
      case 'detect': { const n = await rpc('fin_detect_contracts', {}); toast(n ? `${n} neue Verträge erkannt` : 'Keine neuen Verträge'); await load(); break; }
      case 'new-budget': openSheet({ kind: 'budget' }); break;
      case 'new-position': openSheet({ kind: 'position' }); break;
      case 'position': openSheet({ kind: 'position', id }); break;
      case 'p-del': if (window.confirm('Position löschen?')) { await sb.from('fin_positions').delete().eq('id', id); S.sheet = null; toast('Gelöscht'); await load(); } break;
      case 'budget': openSheet({ kind: 'budget', id }); break;
      case 'b-cat': keepForm('#b-form', ['amt']); S.sheet.cat = b.dataset.cat; render(); break;
      case 'b-del': await sb.from('fin_budgets').delete().eq('id', id); S.sheet = null; toast('Budget gelöscht'); await load(); break;
    }
  } catch (err) { toast('Fehler: ' + (err.message || err)); }
});
function keepForm(sel, names) { const f = document.querySelector(sel); if (!f) return; for (const n of names) { const i = f.querySelector(`[name=${n}]`); if (i) S.sheet[n] = i.value; } }
function confirmDel() { return window.confirm('Diese Buchung wirklich löschen?'); }
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; render(); }
  if (e.target.id === 'bq' && S.sheet) { S.sheet.q = e.target.value; render(); }
  if (e.target.id === 'letter' && S.sheet) S.sheet.letter = e.target.value;
});
document.addEventListener('change', e => { if (e.target.id === 'remember' && S.sheet) S.sheet.remember = e.target.checked; });
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, d = new FormData(f), sh = S.sheet;
  try {
    if (f.id === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email: d.get('email'), password: d.get('pw') });
      S.err = error ? 'Anmeldung fehlgeschlagen: ' + error.message : null; render();
    } else if (f.id === 'eb-form') {
      const file = d.get('pem');
      if (!file || !file.size || file.size > 20000) { sh.err = 'Bitte die .pem-Datei wählen.'; render(); return; }
      sh.busy = true; sh.err = null; render();
      try { await fn({ action: 'setup', app_id: String(d.get('app')).trim(), pem: await file.text() }); toast('Enable Banking eingerichtet'); openBank(); }
      catch (err) { sh.busy = false; sh.err = err.message; render(); }
    } else if (f.id === 'acc-form') {
      sh.v = { name: d.get('name'), bal: d.get('bal') };
      const bal = parseEuro(d.get('bal'));
      if (bal === null && d.get('bal').trim() !== '0') { sh.err = 'Stand als Zahl eingeben, z. B. 40,00'; render(); return; }
      const { error } = await sb.from('fin_accounts').insert({ name: d.get('name').trim(), type: d.get('type'), balance_cents: bal || 0, source: 'manual' });
      if (error) throw error; S.sheet = null; toast('Konto angelegt'); load();
    } else if (f.id === 'imp-form') {
      const file = d.get('file'), acc = d.get('acc'), balRaw = (d.get('bal') || '').trim(), bal = balRaw ? parseEuro(balRaw) : null;
      if (balRaw && bal === null) { sh.err = 'Kontostand als Zahl eingeben'; render(); return; }
      sh.busy = true; sh.err = null; sh.acc = acc; render();
      try { sh.result = await importCsv(file, acc, bal); } catch (err) { sh.err = err.message || String(err); }
      sh.busy = false; render();
    } else if (f.id === 'split-form') {
      const part = parseEuro(d.get('part'));
      if (!part || !sh.c1 || !sh.c2) { sh.part = d.get('part'); sh.err = 'Teilbetrag und beide Kategorien wählen.'; render(); return; }
      await rpc('fin_split', { p_tx: sh.id, p_part_cents: Math.abs(part), p_part_category: sh.c1, p_rest_category: sh.c2 });
      S.sheet = null; toast('Aufgeteilt'); await load();
    } else if (f.id === 'nt-form') {
      const amt = parseEuro(d.get('amt'));
      if (!amt) { keepForm('#nt-form', ['amt', 'cp', 'day']); sh.err = 'Betrag eingeben'; render(); return; }
      const cents = Math.abs(amt) * (sh.dir === 'in' ? 1 : -1);
      const acc = d.get('acc');
      const row = { account_id: acc, booked_on: d.get('day'), amount_cents: cents, counterparty: (d.get('cp') || '').trim() || null, category_id: sh.cat || null, category_source: sh.cat ? 'manual' : null, dedupe_hash: 'm:' + crypto.randomUUID() };
      const { error } = await sb.from('fin_transactions').insert(row); if (error) throw error;
      const a = S.accounts.find(x => x.id === acc);
      await sb.from('fin_accounts').update({ balance_cents: Number(a.balance_cents) + cents }).eq('id', acc);
      S.sheet = null; toast('Gespeichert'); await load();
    } else if (f.id === 'c-form') {
      const amt = parseEuro(d.get('amt'));
      if (!amt) { sh.err = 'Betrag eingeben'; render(); return; }
      const income = d.get('income') === '1';
      const row = {
        provider: d.get('provider').trim(), amount_cents: Math.abs(amt) * (income ? 1 : -1), interval: d.get('interval'), is_income: income,
        next_due_on: d.get('next') || null, notice_period_days: d.get('notice') ? parseInt(d.get('notice'), 10) : null, min_term_end_on: d.get('term') || null,
        customer_number: (d.get('cust') || '').trim() || null, cancel_email: (d.get('mail') || '').trim() || null
      };
      if (sh.kind === 'new-contract') { row.status = 'active'; row.counterparty_pattern = null; const { error } = await sb.from('fin_contracts').insert(row); if (error) throw error; }
      else { const c = S.contracts.find(x => x.id === sh.id); if (c.status === 'suggested') row.status = 'active'; const { error } = await sb.from('fin_contracts').update(row).eq('id', sh.id); if (error) throw error; }
      S.sheet = null; toast('Gespeichert'); await load();
    } else if (f.id === 'p-form') {
      const inv = parseEuro(d.get('inv')) || 0, val = parseEuro(d.get('val')) || 0;
      const row = { name: d.get('name').trim(), kind: d.get('kind'), broker: (d.get('broker') || '').trim() || null, invested_cents: Math.abs(inv), value_cents: Math.abs(val), value_updated_at: TODAY() };
      const { error } = sh.id ? await sb.from('fin_positions').update(row).eq('id', sh.id) : await sb.from('fin_positions').insert(row);
      if (error) throw error; S.sheet = null; toast('Gespeichert'); await load();
    } else if (f.id === 'b-form') {
      const amt = parseEuro(d.get('amt')); const cat = sh.cat || (sh.id && S.budgets.find(x => x.id === sh.id).category_id);
      if (!amt || !cat) { sh.amt = d.get('amt'); sh.err = 'Betrag und Kategorie wählen.'; render(); return; }
      const row = { category_id: cat, amount_cents: Math.abs(amt), period: 'monthly' };
      const { error } = sh.id ? await sb.from('fin_budgets').update(row).eq('id', sh.id) : await sb.from('fin_budgets').upsert(row, { onConflict: 'user_id,category_id,period' });
      if (error) throw error; S.sheet = null; toast('Budget gespeichert'); await load();
    }
  } catch (err) { if (S.sheet) { S.sheet.err = err.message || String(err); render(); } else toast('Fehler: ' + (err.message || err)); }
});

async function importCsv(file, accountId, newBalance) {
  const text = Parser.decode(await file.arrayBuffer());
  const res = Parser.parse(text);
  if (!res.rows.length) throw new Error('In der Datei sind keine Buchungen.');
  await Parser.withHashes(accountId, res.rows);
  const rows = res.rows.map(t => { const cat = Parser.categorize(t, S.rules); return { ...t, account_id: accountId, category_id: cat, category_source: cat ? 'rule' : null }; });
  let inserted = 0;
  for (let i = 0; i < rows.length; i += 500) {
    const { data, error } = await sb.from('fin_transactions').upsert(rows.slice(i, i + 500), { onConflict: 'account_id,dedupe_hash', ignoreDuplicates: true }).select('id');
    if (error) throw error; inserted += (data || []).length;
  }
  const upd = { last_sync_at: new Date().toISOString(), source: 'csv' };
  if (newBalance !== null) upd.balance_cents = newBalance;
  await sb.from('fin_accounts').update(upd).eq('id', accountId);
  return { total: rows.length, inserted, skipped: rows.length - inserted, bad: res.errors.length };
}

(() => {
  const p = new URLSearchParams(location.search);
  if (!p.has('bank')) return;
  const st = p.get('bank');
  setTimeout(() => toast(st === 'ok' ? `${p.get('name')} verbunden · ${p.get('n') || 0} Buchungen geladen`
    : st === 'empty' ? `${p.get('name')}: keine Konten freigegeben. Im Enable-Banking-Control-Panel verknüpft?`
    : 'Verbindung fehlgeschlagen: ' + (p.get('msg') || 'unbekannt')), 600);
  history.replaceState(null, '', location.pathname);
})();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.user) load().then(maybeAutoSync); });
sb.auth.onAuthStateChange((_ev, session) => {
  const was = S.user; S.user = session ? session.user : null;
  if (S.user && !was) load().then(maybeAutoSync); else render();
});
</script>
